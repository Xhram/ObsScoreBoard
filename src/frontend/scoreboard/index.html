<style>
    /* html, body {
    background-color: rgba(255, 255, 255, 0.808);
} */
/* 1920x1080 */
@keyframes scroll {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-100%); }
}

@keyframes drop-in-and-drop-out {
    0%   { transform: translateY(-150%); opacity: 0; }
    15%  { transform: translateY(3px);   opacity: 1; } /* overshoot past final */
    55%  { transform: translateY(-1px);   opacity: 1; } /* bounce back up past final */
    70%  { transform: translateY(0%);    opacity: 1; } /* settle and stay visible */

    /* stay visible through this region, then begin flying up */
    85%  { transform: translateY(0%);    opacity: 1; }
    100% { transform: translateY(-100%); opacity: 0; } /* fly out upwards and fade */
}

@keyframes touchdown-drop-in {
    0%   { height: 0; }
    20%  { height: calc(100% + 20px); }
    90%  { height: calc(100% + 20px); }
    100% { height: 0; }
}

    /* New keyframes for intro and loop animations */

body, html { margin:0; padding:0; font-family: "Montserrat", sans-serif; font-optical-sizing: auto; font-style: normal; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; }
* { box-sizing: border-box; }

.hide {
    display: none !important;
}

#connection-status {
    position: absolute;
    top: 0;
    left: 0;
    color:#ffffff;
    font-size: 21px;
    background-color: rgba(48, 44, 56, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 0px 5px;
}

#scoreboard {
    position: absolute;
    bottom: 0px;
    left: 50%;
    transform: translateX(-50%);
    /* width: 150px; debugging */
    height: 145px; /* debugging */
    aspect-ratio: 5;
    display: grid;
    grid-template-columns: 1fr 3fr 1fr;
    grid-template-rows: 30px 75px 40px;
    gap: 0;
    /* background-color: transparent; debugging */

    --team-left-color: red;
    --team-left-color-text: white;
    --team-right-color: purple;
    --team-right-color-text: white;
    --team-target: var(--team-left-color); /* used for timeouts or animations */
    --team-target-text: var(--team-left-color-text);

    --color-game-data-background: #0f1c13;
    --color-game-data-background-highlight: #051004;
    --color-game-data-text: #d7e2df;
    --color-game-data-text-neutral: #91a09a;
    --color-game-data-highlight: #e0d088;

    --color-meta-data-background: #0f1c13;
    --color-meta-data-text: #d7e2df;
    --color-meta-data-text-neutral: #91a09a;

    --color-flag-background: yellow;
    --color-flag-text: black;

    --time-carousel-duration: 10s;
    --time-carousel-popup-delay: 2s;
    --time-meta-data-popup-time: 0.3s;
    --time-flag-popup-time: 0.15s;
}
.container {
    padding: 5px;
    width: 100%;
    height: 100%;
    grid-column: 1 / span 3;
}
.meta-data-container {
    background-color: var(--color-meta-data-background);
    display: flex;
    flex-direction: row;
    align-items: center;
    overflow: hidden;
    transition: transform var(--time-meta-data-popup-time) ease;
    transform: translateY(100%);
    z-index: -1;

    &.visible {
        transform: translateY(0%);

        .carousel {
            animation-play-state: running;
            animation: scroll calc(var(--time-carousel-popup-delay) + var(--time-carousel-duration)) linear var(--time-carousel-popup-delay) infinite forwards;
        }
    }

    .carousel {
        position: relative;
        display: flex;
        align-items: center;
        width: fit-content;
        animation-play-state: paused;
        /* min-width: 200%; */
        
    }
    .data, .player-badge {
        margin-right: 16px;
    }

    .data {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--color-meta-data-text);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
    }

    .player-badge {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        gap: 4px;

        .hashtag {
            font-size: .8rem;
            font-weight: bold;
            color: var(--color-meta-data-text-neutral);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            margin-right: -1px;
        }

        .number {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--color-meta-data-text);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .name {
            font-size: 1rem;
            font-weight: bold;
            color: var(--color-meta-data-text);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            flex: 1;
            margin-bottom: 1px
        }
    }
}
.teams-container {
    display: flex;
    flex-direction: row;
    background-color: var(--color-game-data-background);
    padding: 0;

    .flag-container {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        min-width: fit-content;
        /* justify-content: center; */
        height: 40px;
        z-index: 9;
        top: 30px;
        background-color: var(--color-flag-background);
        transition: 
            top var(--time-flag-popup-time) ease,
            transform var(--time-flag-popup-time) ease, 
            left var(--time-flag-popup-time) ease, 
            right var(--time-flag-popup-time) ease, 
            width var(--time-flag-popup-time) ease, 
            height var(--time-flag-popup-time) ease;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: 800;
        text-transform: uppercase;
        padding: 0 8px;
        color: var(--color-flag-text);

        &.emitted {
            /* top: calc(30px + 75px); on bottom */ 
            top: -10px;
        }
        &.info {
            background-color: var(--team-target);
            color: var(--team-target-text);
            font-weight: 500;
        }

        &.blame-left, &.blame-left-with-name {
            transform: translateX(0%);
            left: 0;
            width: 50%;
            justify-content: flex-start;
        }
        &.blame-right, &.blame-right-with-name {
            transform: translateX(0%);
            right: 0;
            width: 50%;
            justify-content: flex-end;
        }
        &.blame-right {
            /* flex-direction: row-reverse; */
        }
        .blame {
            width: 0;
            overflow: hidden;
            transition: width var(--time-flag-popup-time) ease;
            display: flex;
            justify-content: flex-end;
            margin-right: auto;
            display: none;
        }

        .player-badge {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 8px;

            .hashtag {
                font-size: .8rem;
                font-weight: bold;
                /* color: var(--color-text); */
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                margin-right: -1px;
            }

            .number {
                font-size: 1.4rem;
                font-weight: bold;
                /* color: var(--color-text); */
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
            }

            .name {
                font-size: 1rem;
                font-weight: bold;
                /* color: var(--color-text); */
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                width: auto;
                margin-bottom: 3px;
            }
        }


        &.blame-left-with-name {
            flex-direction: row;
            justify-content: flex-start;
            .blame {
                width: 100%;
                display: flex;
            }
        }
        &.blame-right-with-name {
            
            justify-content: flex-end;
            .blame {
                width: 100%;
                display: flex;
            }
        }
    }

    .point-score-announcement {
        position: absolute;
        top: -10px;
        left: 0;
        width: 100%;
        height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        font-weight: 800;
        text-transform: uppercase;
        background-color: var(--team-target);
        z-index: 11;
        overflow: hidden;
        transition: 
            top var(--time-flag-popup-time) ease,
            height var(--time-flag-popup-time) ease;

        .logo {
            position: absolute;
            height: 100%;
            aspect-ratio: 1 / 1;
            left: 0;
            bottom: 0;
            height: 180px;
            aspect-ratio: 1 / 1;
            mask-image: radial-gradient(circle at bottom left, rgba(0, 0, 0, 1) 30%, rgba(0, 0, 0, 0) 70%);
            mask-repeat: no-repeat;
            mask-size: cover;
            margin: 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
            opacity: 0.7;

            &::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                background: var(--team-target);
                opacity: 0.6;
            }

            img {
                position: absolute;
                left: -35%;
                bottom: -35%;
                width: 135%;
                height: 135%;
                object-fit: cover;
            }
        }

        &.emitted {
            animation: touchdown-drop-in calc(var(--time-animation-duration) + 0.1s) ease forwards;

            span {
                z-index: 12;
                text-shadow: 2px 0px 2px black;
                animation-play-state: running;
            }

            span:nth-child(1) {
                animation-delay: 0;
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) + 0 * var(--time-drop-in-delay)) calc(0 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(2) {
                animation-delay: calc(1 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 1 * var(--time-drop-in-delay)) calc(1 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(3) {
                animation-delay: calc(2 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 2 * var(--time-drop-in-delay)) calc(2 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(4) {
                animation-delay: calc(3 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 3 * var(--time-drop-in-delay)) calc(3 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(5) {
                animation-delay: calc(4 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 4 * var(--time-drop-in-delay)) calc(4 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(6) {
                animation-delay: calc(5 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 5 * var(--time-drop-in-delay)) calc(5 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(7) {
                animation-delay: calc(6 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 6 * var(--time-drop-in-delay)) calc(6 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(8) {
                animation-delay: calc(7 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 7 * var(--time-drop-in-delay)) calc(7 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(9) {
                animation-delay: calc(8 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 8 * var(--time-drop-in-delay)) calc(8 * var(--time-drop-in-delay)) ease forwards;
            }
            span:nth-child(10) {
                animation-delay: calc(9 * var(--time-drop-in-delay));
                animation: drop-in-and-drop-out calc(var(--time-animation-duration) - 9 * var(--time-drop-in-delay)) calc(9 * var(--time-drop-in-delay)) ease forwards;
            }
        }

        --time-drop-in-delay: 0.05s;
        --time-animation-duration: 3.1s;

        span {
            opacity: 0;
            color: white;
        }
    }

    .team {
        --team-color: #000000;
        display: flex;
        flex: 1;
        min-width: 0; /* prevents overflow */
        background-color: var(--team-color);
        padding: 6px 0;
        z-index: 10;
        position: relative;

        &.left {
            --team-color: var(--team-left-color);
            --gradient-position: left;
            --direction: to right;
            flex-direction: row;
            .border {
                flex-direction: row;
                margin-right: 4px;
            }
            .name {
                text-align: left;
            }
            .possession-indicator {
                margin-left: auto
            }
            .timeouts {
                margin: 2px 0 2px 3px;
            }
        }
        &.right {
            --team-color: var(--team-right-color);
            --gradient-position: right;
            --direction: to left;
            flex-direction: row-reverse;
            .border {
                flex-direction: row-reverse;
                margin-left: 4px;
            }
            .name {
                text-align: right;
            }
            .possession-indicator {
                margin-right: auto
            }
            .timeouts {
                margin: 2px 3px 2px 0;
            }
        }

        &::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: saturate(65%) brightness(65%) hue-rotate(-8deg);
            background: linear-gradient(var(--direction, to right), var(--team-color), transparent 70%);
            opacity: 1;
        }

        .timeouts {
            --color-timeoput: #ffffff;
            --color-timeoiut-used: #555555;
            display: flex;
            flex-direction: column-reverse;
            justify-content: center;
            margin: 2px 4px;

            .timeout {
                position: relative;
                width: 6px;
                min-height: 10px;
                flex: 1;
                margin: 2px 0;
                background-color: var(--color-timeoput);

                &.used {
                    background-color: var(--color-timeoiut-used);
                }
            }

            .timeout.used::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                background: var(--team-color);
                opacity: 0.6;
                filter: saturate(0%) brightness(00%) contrast(50%) ;
            }
        }

        .border::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            z-index: 1;
            filter: saturate(65%) brightness(65%) hue-rotate(-8deg);
            border: 4px solid; 
            border-image: linear-gradient(var(--direction, to right), var(--team-color), transparent 70%) 1;
            border-width: 4px;
            /* border-radius: 8px; */
            /* outline-offset: -4px; */
            /* border-radius: 12px; */
            /* background: linear-gradient(var(--direction, to right), var(--team-color), transparent 70%);
            opacity: 0.6; */
        }

        .border {
            position: relative;
            display: flex;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 4px;
            overflow: hidden;
            /* outline: 6px solid black; */
            /* outline-offset: -4px; */

            .logo {
                position: relative;
                height: 100%;
                aspect-ratio: 1 / 1;
                /* background-color: purple; */
                /* -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1), rgba(0, 0, 0, 0));
                -webkit-mask-repeat: no-repeat;
                -webkit-mask-size: cover; */
                /* mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 80%, rgba(0, 0, 0, 0) 100%); */
                mask-image: radial-gradient(circle at var(--gradient-position), rgba(0, 0, 0, 1) 80%, rgba(0, 0, 0, 0) 90%);
                mask-repeat: no-repeat;
                mask-size: cover;
                margin: 0 0;
                display: flex;
                align-items: center;
                justify-content: center;

                img {
                    position: relative;
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }
            }

            .name {
                position: relative;
                flex: 1;
                padding: 0 5px;
                font-size: 1.5em;
                width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-weight: bold;
                color: #f3eadf;
                text-shadow: 2px 0px 2px black;
            }

            .possession-indicator {
                position: relative;
                width: 8px;
                height: 8px;
                background-color: #f3eadf;
                border-radius: 50%;
                visibility: hidden;
            }

            .possession-indicator.in-possession {
                visibility: visible;
            }

            .score {
                font-size: 2.5em;
                font-weight: bold;
                color: #f3eadf;
                text-shadow: 2px 0px 2px black;
                margin: 0 8px;
            }
        }
    }
}
.game-data-container {
    position: relative;
    background-color: var(--color-game-data-background);
    display: grid;
    grid-template-columns: repeat(2, 1fr) auto repeat(2, 1fr);
    font-size: 1.5rem;
    font-weight: bolder;
    padding: 0 6px;
    overflow: hidden;

    .badge {
        position: absolute;
        right: 0;
        height: 100%;
        aspect-ratio: 1 / 1;
        scale: .8;
        object-fit: contain;
    }

    .game-duration {
        align-self: center;
        grid-column: 1 / span 2;
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        .quarter {
            color: var(--color-game-data-text-neutral);
            margin-right: auto;
            flex: 1;
        }
        .clock {
            color: var(--color-game-data-text);
            flex: 2;
            margin-right: auto;
        }
    }
    .play-clock {
        align-self: center;
        grid-column: 3;
        color: var(--color-game-data-highlight);
        background-color: var(--color-game-data-background-highlight);
        padding: 0 4px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: width 0.3s ease, padding 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 0 4px 4px var(--color-game-data-background-highlight);

        &.hidden {
            width: 0;
            padding: 0;
            box-shadow: none;
        }
    }

    .down-distance {
        align-self: center;
        grid-column: 4 / span 2;
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 6px;

        span {
            color: var(--color-game-data-text);
        }
        
        .filler {
            margin-bottom: 1px;
            align-self: flex-end;
            color: var(--color-game-data-text-neutral);
            font-size: 80%;
        }
    }
}
</style>
