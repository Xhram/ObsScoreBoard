<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard Player Stats</title>
    <link rel="stylesheet" href="style/main.css" />
</head>
<body>
    <main class="scoreboard-page">
        <header class="scoreboard-header">
            <h1>Player Stats</h1>
        </header>

        <section class="bb-team-grid">
            <section id="home-column" class="bb-team-column">
                <h2 id="home-title">Home Team</h2>
                <div id="home-roster" class="bb-roster"></div>
            </section>

            <section id="away-column" class="bb-team-column">
                <h2 id="away-title">Away Team</h2>
                <div id="away-roster" class="bb-roster"></div>
            </section>
        </section>

        <div id="empty" class="bb-empty hide">No players added yet.</div>
    </main>

    <script src="scripts/main.js"></script>
</body>
</html>
